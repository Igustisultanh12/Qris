services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: kreatif-qris-app:latest
    container_name: qris_app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      APP_NAME: "PT Kreatif Abadi QRIS Platform"
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "http://localhost:8000"
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: qris_platform
      DB_USERNAME: qris_user
      DB_PASSWORD: qris_secret_password
      REDIS_HOST: redis
      REDIS_PORT: 639
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    volumes:
      - storage_data:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - qris_network

  mysql:
    image: mysql:8.0
    container_name: qris_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: qris_platform
      MYSQL_USER: qris_user
      MYSQL_PASSWORD: qris_secret_password
      MYSQL_ROOT_PASSWORD: root_secret_password
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "qris_user", "-pqris_secret_password"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qris_network

  redis:
    image: redis:7-alpine
    container_name: qris_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - qris_network

  scheduler:
    image: kreatif-qris-app:latest
    container_name: qris_scheduler
    restart: unless-stopped
    command: ["sh", "-c", "while [ true ]; do php /var/www/html/artisan schedule:run --verbose --no-interaction & sleep 60; done"]
    depends_on:
      - app
    networks:
      - qris_network

networks:
  qris_network:
    driver: bridge

volumes:
  db_data:
    driver: local
  redis_data:
    driver: local
  storage_data:
    driver: local
